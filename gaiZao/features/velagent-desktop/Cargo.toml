[package]
name = "velagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "VelAgent desktop shell: local AI control plane + frontend host"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }
futures-util = "0.3"
tokio-stream = "0.1"

[features]
# 生产构建用内嵌前端资源（等价于 tauri CLI 构建时加的 --features custom-protocol）。
# 开发时用 npm run desktop:dev（tauri CLI 会 --no-default-features，走 devUrl + Vite 热更新）。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
